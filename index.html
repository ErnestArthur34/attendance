<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TVET Attendance</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f3d2e">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f3d2e;--gold:#e8b32a;--paper:#f4f6f2;--card:#fff;--red:#c8372d;--ok:#1f8a4c;--mut:#5d6b65;--ln:#d9dfda}
@media(prefers-color-scheme:dark){:root{--paper:#0e1a16;--card:#16251f;--ln:#2a3d35;--mut:#9bb0a7;--ink:#d8efe3}body{color:#e8f2ec}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Sora,system-ui,sans-serif;background:var(--paper);color:#1b2a24;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#0f3d2e;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--gold)}
.hr{display:flex;align-items:center;gap:10px}.logo{width:52px;height:52px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
header b{font-size:14px;letter-spacing:.2px}header small{display:block;opacity:.7;font-weight:400;font-size:11px}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px;color:var(--ink)}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:inherit}
input,select,textarea{background:#12362b!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border:1px solid #3d6b5a;color-scheme:dark;caret-color:#e8b32a}
input::placeholder{color:#b9d3c8!important;-webkit-text-fill-color:#b9d3c8}
select option{background:#12362b;color:#fff}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #12362b inset!important;-webkit-text-fill-color:#fff!important}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1)}
button{cursor:pointer;border:0;background:#1f8a4c;color:#fff;font-weight:600;margin-top:12px}button.alt{background:#e8b32a;color:#0f3d2e;border:0}
header button.alt{background:transparent;color:#fff;border:1px solid #ffffff88}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
.clock{font-size:40px;font-weight:800;text-align:center;letter-spacing:-1px}.date{text-align:center;color:var(--mut);margin-bottom:12px}
.ring{width:190px;height:190px;border-radius:50%;margin:8px auto 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:8px solid var(--ln);transition:border-color .3s;padding:14px}
.ring.in{border-color:var(--ok)}.ring.out{border-color:var(--red)}.ring strong{font-size:22px}.ring span{font-size:12px;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row button{margin-top:0}
.btn-in{background:var(--ok)}.btn-out{background:#8a5a00}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{margin:0;width:auto;padding:8px 14px;background:#12362b;color:#fff;border:1px solid #3d6b5a}.tabs button.on{background:#e8b32a;color:#0f3d2e;border-color:#e8b32a}
.msg{padding:10px;border-radius:10px;margin-top:10px;font-size:13px;background:#fff3d6;color:#5a4300}.msg.bad{background:#fde3e0;color:#7a1b13}.msg.good{background:#dff3e6;color:#12532d}
.hide{display:none}.tbl{overflow-x:auto}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div><b>Ghana TVET Service</b><small>Central Regional Directorate · Attendance · v1.6</small></div><div class="hr"><button id="lo" class="alt hide" style="width:auto;margin:0;padding:6px 12px;color:#fff;border-color:#ffffff55">Log out</button><img class="logo" src="logo.png" alt="Ghana TVET Service logo"></div></header>
<main>
<!-- AUTH -->
<section id="auth" class="card">
 <h2 id="at">Log in</h2>
 <div id="regf" class="hide"><label>Full name</label><input id="rn"><label>Position</label><select id="rp"><option value="">Select position</option><option>REGIONAL DIRECTOR</option><option>DEPUTY REGIONAL DIRECTOR</option><option>PRINCIPAL</option><option>HUMAN RESOURCE</option><option>REGIONAL STAFF</option><option>INSTITUTE STAFF</option><option>REPORTING STAFF</option><option>NSS PERSONNEL</option><option>VOLUNTARY STAFF</option></select></div>
 <label>Username</label><input id="un" autocapitalize="none" autocomplete="username">
 <label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <button id="go">Log in</button><button id="sw" class="alt">Create an account</button><div id="am"></div>
</section>
<!-- APP -->
<div id="app" class="hide">
 <div class="tabs"><button data-t="me" class="on">Attendance</button><button data-t="rec">Records</button><button data-t="adm" class="adm hide">Admin</button></div>
 <section id="t-me">
  <div class="card"><div class="clock" id="clk"></div><div class="date" id="dt"></div>
   <div class="ring" id="ring"><strong id="rs">Locating…</strong><span id="rd"></span></div>
   <div class="row"><button id="bin" class="btn-in" disabled>Sign in</button><button id="bout" class="btn-out" disabled>Sign out</button></div>
   <div id="mm"></div></div>
  <div class="card"><h2>Today</h2><div class="tbl"><table id="today"></table></div></div>
 </section>
 <section id="t-rec" class="hide"><div class="card"><h2>Records</h2>
  <div class="row"><div><label>From</label><input type="date" id="rf"></div><div><label>To</label><input type="date" id="rt"></div></div>
  <div class="row" style="margin-top:4px"><div><label>View</label><select id="rv"><option value="sum">Daily summary</option><option value="all">All entries</option></select></div><div><label>Late after</label><input type="time" id="late" value="08:00"></div></div>
  <div class="row" style="margin-top:12px"><button id="rl">Show</button><button id="rx" class="alt" style="margin-top:0">Export CSV</button></div>
  <div class="tbl" style="margin-top:10px"><table id="rtab"></table></div>
  <h2 style="margin-top:18px">Count per staff</h2><div class="tbl"><table id="ctab"></table></div></div></section>
 <section id="t-adm" class="hide">
  <div class="card"><h2>Allowed locations</h2>
   <label>Name</label><input id="ln"><div class="row"><div><label>Latitude</label><input id="la" inputmode="decimal"></div><div><label>Longitude</label><input id="lg" inputmode="decimal"></div></div>
   <label>Radius (metres)</label><input id="lr" type="number" value="100">
   <div class="row" style="margin-top:12px"><button id="lu" class="alt" style="margin-top:0">Use my position</button><button id="ls" style="margin-top:0">Save location</button></div>
   <div class="tbl" style="margin-top:10px"><table id="ltab"></table></div></div>
  <div class="card"><h2>Staff</h2><div class="tbl"><table id="stab"></table></div></div>
 </section>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBEmsqpXTTlc-WfYjYrEnD0NxCNFyMWtCo",authDomain:"attendance-bb993.firebaseapp.com",projectId:"attendance-bb993",storageBucket:"attendance-bb993.firebasestorage.app",messagingSenderId:"17576441287",appId:"1:17576441287:web:9100d5286f0ac0daf2d5e2"});
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
const $=i=>document.getElementById(i),MAXACC=60;
let me=null,locs=[],pos=null,near=null,reg=false,geoOk=false,st={in:false,out:false};
const mail=async u=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.trim().toLowerCase()));return [...new Uint8Array(b)].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('')+'@atds.local'};
const pass=p=>p+'#atds-2026'; // Firebase needs 6+ chars; this lets people use any password length
const say=(el,t,c)=>$(el).innerHTML=t?`<div class="msg ${c||''}">${t}</div>`:'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let off=0;const now=()=>new Date(Date.now()+off);
async function syncTime(){try{const a=Date.now(),r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'}),d=r.headers.get('date'),b=Date.now();if(d)off=new Date(d).getTime()+(b-a)/2-b}catch(e){}}
syncTime();setInterval(syncTime,300000);
const acc=d=>{const [h,m]=d.toLocaleTimeString('en-GB',{timeZone:'Africa/Accra',hour12:false,hour:'2-digit',minute:'2-digit'}).split(':').map(Number);return h*60+m};
const tms=t=>t&&t.at?t.at.toDate().toLocaleTimeString('en-GB',{timeZone:'Africa/Accra',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}):'…';
const fmt=t=>t?t.toDate().toLocaleString('en-GB',{timeZone:'Africa/Accra',second:'2-digit',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}):'…';
const day=d=>d.toISOString().slice(0,10);

/* ---------- auth ---------- */
$('sw').onclick=()=>{reg=!reg;$('regf').classList.toggle('hide',!reg);$('at').textContent=reg?'Create account':'Log in';$('go').textContent=reg?'Create account':'Log in';$('sw').textContent=reg?'I have an account':'Create an account';say('am','')};
$('go').onclick=async()=>{
 const u=$('un').value,p=$('pw').value;if(!u.trim()||!p)return say('am','Enter a username and a password.','bad');const em=await mail(u),pp=pass(p);
 try{if(reg){if(!$('rn').value||!$('rp').value)return say('am','Enter your full name and select a position.','bad');
   const c=await auth.createUserWithEmailAndPassword(em,pp);
   await db.collection('users').doc(c.user.uid).set({name:$('rn').value.trim(),position:$('rp').value.trim(),username:u.trim().toLowerCase(),role:'staff',locations:[],active:true,created:TS()});
  }else await auth.signInWithEmailAndPassword(em,pp);
 }catch(e){say('am',e.code==='auth/email-already-in-use'?'That username is taken.':'Could not log in. Check your username and password.','bad')}};
$('lo').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
 if(!u){me=null;$('auth').classList.remove('hide');$('app').classList.add('hide');$('lo').classList.add('hide');return}
 const s=await db.collection('users').doc(u.uid).get();me={uid:u.uid,...s.data()};
 $('auth').classList.add('hide');$('app').classList.remove('hide');$('lo').classList.remove('hide');
 document.querySelectorAll('.adm').forEach(e=>e.classList.toggle('hide',me.role!=='admin'));
 await loadLocs();watch();today();
});

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 ['me','rec','adm'].forEach(t=>$('t-'+t).classList.toggle('hide',t!==b.dataset.t));
 if(b.dataset.t==='adm')admin()});

/* ---------- clock ---------- */
setInterval(()=>{const n=now();$('clk').textContent=n.toLocaleTimeString('en-GB',{timeZone:'Africa/Accra',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});$('dt').textContent=n.toLocaleDateString('en-GB',{timeZone:'Africa/Accra',weekday:'long',day:'numeric',month:'long',year:'numeric'})},500);

/* ---------- geofence ---------- */
const dist=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function loadLocs(){const s=await db.collection('locations').where('active','==',true).get();locs=s.docs.map(d=>({id:d.id,...d.data()}))}
function allowed(){return me.role==='admin'&&!(me.locations||[]).length?locs:locs.filter(l=>(me.locations||[]).includes(l.id))}
function watch(){
 if(!navigator.geolocation)return say('mm','This device cannot share its location.','bad');
 navigator.geolocation.watchPosition(p=>{pos=p.coords;check()},e=>{pos=null;near=null;ui('out','Location off','Allow location access for this app.');},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function check(){
 const al=allowed();if(!al.length)return ui('out','No location','Ask an admin to assign you a location.');
 if(pos.accuracy>MAXACC)return ui('out','Weak GPS',`Accuracy ±${Math.round(pos.accuracy)} m. Move to open sky.`);
 const r=al.map(l=>({l,d:dist(pos.latitude,pos.longitude,l.lat,l.lng)})).sort((a,b)=>a.d-b.d)[0];
 near=r.d<=r.l.radius?r.l:null;
 near?ui('in',r.l.name,`${Math.round(r.d)} m from centre`,true):ui('out','Outside',`${Math.round(r.d)} m from ${r.l.name} (limit ${r.l.radius} m)`)}
function ui(c,a,b,ok){$('ring').className='ring '+c;$('rs').textContent=a;$('rd').textContent=b;geoOk=!!ok;setBtns()}
function setBtns(){$('bin').disabled=!(geoOk&&!st.in);$('bout').disabled=!(geoOk&&st.in&&!st.out)}
async function mark(type){
 if(!near||!pos)return;
 $('bin').disabled=$('bout').disabled=true;
 try{await db.collection('attendance').doc(me.uid+'_'+day(now())+'_'+type).set({uid:me.uid,name:me.name,position:me.position,type,locationId:near.id,locationName:near.name,lat:pos.latitude,lng:pos.longitude,accuracy:Math.round(pos.accuracy),date:day(now()),at:TS()});
  today()}catch(e){say('mm','Could not save. You may have already signed '+type+' today, or there is no connection.','bad');today()}}
$('bin').onclick=()=>mark('in');$('bout').onclick=()=>mark('out');

/* ---------- records ---------- */
async function q(from,to,mine){
 let r=db.collection('attendance'),own=mine||me.role==='staff';
 r=own?r.where('uid','==',me.uid):r.where('date','>=',from).where('date','<=',to);
 const s=await r.get();
 return s.docs.map(d=>d.data()).filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0))}
async function today(){const d=day(now()),rows=await q(d,d,true);st={in:rows.some(r=>r.type==='in'),out:rows.some(r=>r.type==='out')};setBtns();
 const ri=rows.find(r=>r.type==='in'),ro=rows.find(r=>r.type==='out');
 if(st.out)say('mm','Signed in at '+tms(ri)+', signed out at '+tms(ro)+' (server time). Done for today.','good');else if(st.in)say('mm','Signed in at '+tms(ri)+' (server time). Sign out when you leave.','good');
 $('today').innerHTML='<tr><th>Type</th><th>Time</th><th>Place</th></tr>'+(rows.map(r=>`<tr><td>${r.type==='in'?'In':'Out'}</td><td>${fmt(r.at)}</td><td>${esc(r.locationName)}</td></tr>`).join('')||'<tr><td colspan=3>No records yet today.</td></tr>')}
let last=[],csvD={head:[],rows:[]};
const sec=r=>r&&r.at?r.at.seconds:0;
const tm=r=>r&&r.at?r.at.toDate().toLocaleTimeString('en-GB',{timeZone:'Africa/Accra',hour:'2-digit',minute:'2-digit',hour12:true}):'–';
const hrs=m=>m==null?'–':Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';
try{$('late').value=localStorage.getItem('lateAfter')||'08:00'}catch(e){}
$('late').onchange=()=>{try{localStorage.setItem('lateAfter',$('late').value)}catch(e){};render()};
const t0=now();$('rt').value=day(t0);$('rf').value=day(new Date(t0-6*864e5));
function summarise(rows,late){
 const g={};rows.forEach(r=>{(g[r.uid+'|'+r.date]=g[r.uid+'|'+r.date]||[]).push(r)});
 const [lh,lm]=(late||'08:00').split(':').map(Number);
 return Object.values(g).map(a=>{a.sort((x,y)=>sec(x)-sec(y));
  const ins=a.filter(x=>x.type==='in'),outs=a.filter(x=>x.type==='out'),fi=ins[0],lo=outs[outs.length-1];
  const mins=fi&&lo&&sec(lo)>sec(fi)?(sec(lo)-sec(fi))/60:null;
  let st='No sign-in';
  if(fi){st=(acc(fi.at.toDate())>lh*60+lm?'Late':'On time')+(lo?'':' (still in)')}
  return{uid:a[0].uid,date:a[0].date,name:a[0].name,position:a[0].position,fi,lo,mins,st,loc:(fi||a[0]).locationName}})
 .sort((x,y)=>y.date.localeCompare(x.date)||String(x.name).localeCompare(String(y.name)))}
function counts(r){const g={};r.forEach(x=>{const o=g[x.uid]=g[x.uid]||{name:x.name,position:x.position,d:0,l:0,m:0};if(x.fi)o.d++;if(x.st.startsWith('Late'))o.l++;o.m+=x.mins||0});return Object.values(g).sort((a,b)=>String(a.name).localeCompare(String(b.name)))}
function render(){
 if(!last.length&&!$('rtab').dataset.ran)return;
 const sm=summarise(last,$('late').value),cn=counts(sm);
 $('ctab').innerHTML='<tr><th>Staff</th><th>Days present</th><th>Late</th><th>Hours</th></tr>'+(cn.map(o=>`<tr><td>${esc(o.name)}<br><small>${esc(o.position)}</small></td><td>${o.d}</td><td>${o.l}</td><td>${hrs(o.m)}</td></tr>`).join('')||'<tr><td colspan=4>No records for these dates.</td></tr>');
 const cnRows=[[],['Staff','Days present','Late','Hours'],...cn.map(o=>[o.name,o.d,o.l,hrs(o.m)])];
 if($('rv').value==='sum'){
  const r=sm;
  csvD={head:['Date','Name','Position','Location','First in','Last out','Hours','Status'],rows:r.map(x=>[x.date,x.name,x.position,x.loc,tm(x.fi),tm(x.lo),hrs(x.mins),x.st]).concat(cnRows)};
  $('rtab').innerHTML='<tr><th>Date</th><th>Staff</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr>'+(r.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}<br><small>${esc(x.position)}</small></td><td>${tm(x.fi)}</td><td>${tm(x.lo)}</td><td>${hrs(x.mins)}</td><td style="color:${x.st.startsWith('Late')?'#e0645a':'#5fd08a'}">${x.st}</td></tr>`).join('')||'<tr><td colspan=6>No records for these dates.</td></tr>');
 }else{
  csvD={head:['Name','Position','Type','Time','Location','Lat','Lng','Accuracy(m)'],rows:last.map(r=>[r.name,r.position,r.type,fmt(r.at),r.locationName,r.lat,r.lng,r.accuracy])};
  $('rtab').innerHTML='<tr><th>Staff</th><th>Type</th><th>Time</th><th>Place</th></tr>'+(last.map(r=>`<tr><td>${esc(r.name)}<br><small>${esc(r.position)}</small></td><td>${r.type}</td><td>${fmt(r.at)}</td><td>${esc(r.locationName)}</td></tr>`).join('')||'<tr><td colspan=4>No records for these dates.</td></tr>')}}
$('rl').onclick=async()=>{const f=$('rf').value||day(now()),t=$('rt').value||f;$('rtab').dataset.ran=1;try{last=await q(f,t);render()}catch(e){$('rtab').innerHTML='<tr><td>Could not load records. Check your connection.</td></tr>'}};
$('rv').onchange=render;
$('rx').onclick=()=>{if(!csvD.rows.length)return;const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const t=[csvD.head.map(c).join(','),...csvD.rows.map(r=>r.map(c).join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='attendance-'+$('rv').value+'.csv';a.click()};

/* ---------- admin ---------- */
$('lu').onclick=()=>pos?($('la').value=pos.latitude.toFixed(6),$('lg').value=pos.longitude.toFixed(6)):alert('Waiting for GPS.');
$('ls').onclick=async()=>{const n=$('ln').value.trim(),a=+$('la').value,g=+$('lg').value,r=+$('lr').value;if(!n||!a||!g||r<10)return alert('Enter a name, coordinates and a radius of at least 10 m.');
 await db.collection('locations').add({name:n,lat:a,lng:g,radius:r,active:true});['ln','la','lg'].forEach(i=>$(i).value='');await loadLocs();admin()};
async function admin(){
 $('ltab').innerHTML='<tr><th>Location</th><th>Radius</th><th></th></tr>'+locs.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.radius} m</td><td><a href="#" data-d="${l.id}">Remove</a></td></tr>`).join('');
 $('ltab').querySelectorAll('[data-d]').forEach(a=>a.onclick=async e=>{e.preventDefault();if(confirm('Remove this location?')){await db.collection('locations').doc(a.dataset.d).update({active:false});await loadLocs();admin()}});
 const s=await db.collection('users').get();
 $('stab').innerHTML='<tr><th>Staff</th><th>Role</th><th>Locations</th></tr>'+s.docs.map(d=>{const u=d.data();return`<tr><td>${esc(u.name)}<br><small>${esc(u.position)}</small></td>
 <td><select data-r="${d.id}"><option${u.role==='staff'?' selected':''}>staff</option><option${u.role==='supervisor'?' selected':''}>supervisor</option><option${u.role==='admin'?' selected':''}>admin</option></select></td>
 <td><select multiple data-l="${d.id}" size="3">${locs.map(l=>`<option value="${l.id}"${(u.locations||[]).includes(l.id)?' selected':''}>${esc(l.name)}</option>`).join('')}</select></td></tr>`}).join('');
 $('stab').querySelectorAll('[data-r]').forEach(x=>x.onchange=()=>db.collection('users').doc(x.dataset.r).update({role:x.value}));
 $('stab').querySelectorAll('[data-l]').forEach(x=>x.onchange=()=>db.collection('users').doc(x.dataset.l).update({locations:[...x.selectedOptions].map(o=>o.value)}))}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
